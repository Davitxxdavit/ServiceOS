# Local-only Supabase. Do not link or push this stack to a hosted project.

project_id = "serviceos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://localhost:5173/verify-email",
  "http://127.0.0.1:5173/verify-email",
  "http://localhost:5173/reset-password",
  "http://127.0.0.1:5173/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true

[functions.ai-assistant]
verify_jwt = true
